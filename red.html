<body>
<div id="app">
<aside class="list">
<header class="list-head">
<h1><img class="logo" id="logo" alt=""><span class="bw"><b>Rod</b>app</span></h1>
<div class="tr"><button class="ear" id="sndTop" aria-label="Listening for a sound call. Tap to change." hidden></button><button class="me" id="meBtn" aria-label="Settings"></button></div>
</header>
<div class="banner" id="banner" hidden></div>
<div class="links" id="links"></div>
<div class="modes">
<button class="mode wide send" id="numMode"><strong>New chat</strong><span>By phone number</span></button>
<button class="mode wide snd" id="sndMode"><strong>Connect by sound</strong><span>Call a nearby device, or wait for a call</span></button>
<button class="mode" id="sendMode"><strong>Sender</strong><span>Show my QR</span></button>
<button class="mode" id="recvMode"><strong>Receiver</strong><span>Scan a QR</span></button>
</div>
</aside>
<main class="chat" id="chat">
<header class="chat-head" id="chatHead"></header>
<div class="msgs" id="msgs" aria-live="polite"></div>
<div class="composer" id="composer" hidden>
<button class="cbtn" id="stkBtn" aria-label="Stickers"></button>
<button class="cbtn" id="attBtn" aria-label="Share a photo, file, link or location"></button>
<textarea id="input" rows="1" placeholder="Message" aria-label="Message"></textarea>
<button class="send-btn" id="sendBtn" aria-label="Send message" hidden></button>
<button class="send-btn" id="micBtn" aria-label="Record a voice message"></button>
<div class="recbar"><i class="recdot"></i><strong id="recT">0:00</strong><span style="flex:1"></span><button class="ghost" id="recX">Cancel</button><button class="send-btn" id="recOk" aria-label="Send voice message"></button></div>
</div>
</main>
</div>
<div id="sheetRoot"></div>
<div id="toast" role="status"></div>
